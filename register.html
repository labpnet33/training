<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Create account | My Pnet Lab</title><link rel="stylesheet" href="/auth.css"></head><body data-page="register"><main class="auth-shell"><a class="brand" href="/">My Pnet Lab</a><section class="auth-card"><p class="eyebrow">GET STARTED</p><h1>Create your account</h1><p class="muted">Register using your email address.</p><div class="notice" id="notice" role="status" aria-live="polite" hidden></div><form id="auth-form"><label for="full-name">Full name</label><input id="full-name" name="full-name" autocomplete="name" maxlength="100" required><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required><label for="confirm-password">Confirm password</label><input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="8" required><button class="primary" type="submit">Create account</button></form><p class="center muted">Already registered? <a href="/login">Sign in</a></p><p class="center"><a href="/">← Back to website</a></p></section></main><script type="module" src="/auth.js"></script></body></html>
