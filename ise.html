<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ISE Virtual Device | MyPnetLab</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2d;--panel2:#11243a;--line:#203750;--text:#e7f0fb;--muted:#8fa6bf;--accent:#35d0ba;--accent2:#5da9ff;--warn:#f5b942;--bad:#ff6b7d;--good:#57d38c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#153657 0,#07111f 45%);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);background:rgba(5,14,26,.86);padding:22px 16px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;align-items:center;gap:11px}.mark{height:38px;width:38px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#247ca4);display:grid;place-items:center;font-weight:900;color:#06201f}.brand b{font-size:16px}.brand small{display:block;color:var(--muted);margin-top:2px}.nav{display:grid;gap:5px}.nav button{border:0;text-align:left;color:var(--muted);background:transparent;padding:11px 12px;border-radius:9px}.nav button:hover,.nav button.on{background:#123049;color:#fff}.nav button.on{box-shadow:inset 3px 0 var(--accent)}.sidefoot{margin-top:auto;color:var(--muted);font-size:12px;line-height:1.6}.main{padding:26px 32px 46px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:25px}.eyebrow{color:var(--accent);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:11px}.top h1{margin:7px 0 4px;font-size:29px;letter-spacing:-.03em}.top p{margin:0;color:var(--muted)}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);color:var(--text);background:#10243a;border-radius:8px;padding:9px 13px}.btn:hover{border-color:#4f7ea8}.btn.primary{background:var(--accent);border-color:var(--accent);color:#052320;font-weight:800}.btn.danger{background:#3a1928;border-color:#743247;color:#ffb4bd}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:16px}.card{background:linear-gradient(150deg,rgba(16,36,58,.94),rgba(9,24,40,.94));border:1px solid var(--line);border-radius:13px;padding:17px;box-shadow:0 12px 32px #0002}.stat .label{color:var(--muted);font-size:12px}.stat .num{font-size:29px;font-weight:800;margin-top:10px}.stat .hint{font-size:11px;color:var(--good);margin-top:4px}.cols{grid-template-columns:1.35fr 1fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.section-title h2{font-size:16px;margin:0}.section-title span{color:var(--muted);font-size:12px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:11px 8px;border-bottom:1px solid #1b3047;text-align:left;white-space:nowrap}th{color:#9cb5cf;font-size:11px;text-transform:uppercase;letter-spacing:.08em}td{font-size:13px}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:700;background:#173750;color:#a9d9ff}.pill.good{background:#123d37;color:#7af1be}.pill.bad{background:#421c2a;color:#ff9dab}.pill.warn{background:#493b1d;color:#ffd479}.dot{height:7px;width:7px;border-radius:50%;background:currentColor}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;background:#091828;border:1px solid #29425d;color:var(--text);border-radius:7px;padding:9px 10px;outline:0}input:focus,select:focus,textarea:focus{border-color:var(--accent)}textarea{min-height:90px;resize:vertical}.toolbar{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}.search{max-width:300px}.empty{color:var(--muted);padding:22px 4px}.kv{display:grid;grid-template-columns:150px 1fr;gap:9px;font-size:13px}.kv b{color:var(--muted);font-weight:500}.logline{display:grid;grid-template-columns:145px 90px 1fr;gap:10px;border-bottom:1px solid #1b3047;padding:10px 0;font-size:12px}.notice{padding:11px 13px;border:1px solid #2b5368;background:#0b2a39;border-radius:9px;color:#b7e6f0;margin-bottom:15px}.terminal{background:#050c14;border:1px solid #203b50;border-radius:11px;padding:15px}.terminal pre{min-height:210px;max-height:410px;overflow:auto;white-space:pre-wrap;color:#a9f4d4;margin:0 0 12px;font:12px/1.6 ui-monospace,monospace}.termrow{display:flex;gap:8px}.termrow input{font:12px ui-monospace,monospace}.muted{color:var(--muted)}.hidden{display:none!important}.check{display:flex;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid #1b3047}.check:last-child{border:0}.check i{height:10px;width:10px;border-radius:50%;background:var(--good);display:block}.check i.bad{background:var(--bad)}.toast{position:fixed;right:25px;bottom:25px;background:#153b3d;border:1px solid #3f9b8c;color:#d7fff5;padding:12px 16px;border-radius:9px;box-shadow:0 10px 30px #0005;z-index:10}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:18px;z-index:5}.modal>div{width:min(620px,100%);max-height:90vh;overflow:auto}.actions-cell{display:flex;gap:6px}.small{padding:5px 8px;font-size:12px}@media(max-width:1000px){.shell{grid-template-columns:1fr}.side{position:static;border-right:0;border-bottom:1px solid var(--line);padding:14px;gap:12px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.sidefoot{display:none}.main{padding:20px 14px}.stats{grid-template-columns:repeat(2,1fr)}.cols,.three{grid-template-columns:1fr}}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.top{display:block}.actions{margin-top:15px}.kv{grid-template-columns:110px 1fr}.logline{grid-template-columns:1fr}.top h1{font-size:24px}}
</style>
</head>
<body>
<div class="shell"><aside class="side"><div class="brand"><div class="mark">ISE</div><div><b>MyPnetLab</b><small>Virtual security devices</small></div></div><nav class="nav" id="nav"></nav><div class="sidefoot">ISE-inspired network access control<br><span class="mono">simulator mode · local persistence</span></div></aside><main class="main"><div class="top"><div><div class="eyebrow">Build a Lab device</div><h1 id="pageTitle">ISE Policy Services</h1><p id="pageSub">Centralized identity, RADIUS/TACACS+ policy, and access visibility.</p></div><div class="actions"><button class="btn" id="saveBtn">Save configuration</button><button class="btn primary" id="authBtn">Test authentication</button></div></div><div id="app"></div></main></div><div id="modal" class="hidden"></div><div id="toast" class="toast hidden"></div>
<script>
(() => {
const KEY='mypnetlab-ise-v1';
const seed={config:{hostname:'ISE-LAB',ip:'10.99.99.10',mask:'255.255.255.0',gateway:'10.99.99.1',dns:'10.99.99.1',radius:true,tacacs:true,radiusPort:1812,acctPort:1813,tacacsPort:49,secret:'NKise26',services:true},devices:[{id:'nad-1',name:'ACC-SW1',type:'Cisco switch',ip:'10.99.99.11',secret:'NKise26',protocol:'RADIUS',enabled:true},{id:'nad-2',name:'EDGE-R1',type:'Cisco router',ip:'10.99.99.12',secret:'NKise26',protocol:'TACACS+',enabled:true}],users:[{id:'u-1',username:'alice',password:'C1sco!23',group:'Employees',role:'Network User',vlan:'20',acl:'EMPLOYEE-ACCESS',enabled:true},{id:'u-2',username:'admin',password:'NetAdmin!23',group:'NetOps',role:'Network Administrator',vlan:'99',acl:'NETOPS-ADMIN',enabled:true},{id:'u-3',username:'guest',password:'Guest!23',group:'Guests',role:'Guest',vlan:'50',acl:'GUEST-INTERNET',enabled:true}],endpoints:[{id:'ep-1',mac:'00:11:22:33:44:55',name:'PC1',group:'Employees',vlan:'20',enabled:true},{id:'ep-2',mac:'AA:BB:CC:DD:EE:01',name:'CAM1',group:'IoT',vlan:'40',enabled:true}],policies:[{id:'p-1',name:'Network administrators',kind:'Authentication',condition:'group=NetOps',action:'Permit',profile:'NETOPS-ADMIN',priority:10},{id:'p-2',name:'Employees',kind:'Authentication',condition:'group=Employees',action:'Permit',profile:'EMPLOYEE-ACCESS',priority:20},{id:'p-3',name:'Guests default deny',kind:'Authentication',condition:'group=Guests',action:'Permit',profile:'GUEST-INTERNET',priority:30}],logs:[{time:new Date().toISOString(),type:'SYSTEM',message:'ISE virtual device initialized in simulator mode',detail:'Persistent local policy store ready',status:'info'}],sessions:[]};
let state=load(),tab='dashboard';
function load(){try{return Object.assign(structuredClone(seed),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return structuredClone(seed)}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));toast('Configuration saved to this lab')} function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))} function now(){return new Date().toISOString()} function toast(t){const x=document.querySelector('#toast');x.textContent=t;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),2400)} function pill(t,c=''){return `<span class="pill ${c}"><i class="dot"></i>${esc(t)}</span>`}
const tabs=[['dashboard','Dashboard'],['devices','Network devices'],['identities','Identities'],['policies','Policies'],['logs','Live logs'],['settings','Network & services'],['diagnostics','Diagnostics'],['cli','CLI console']];
function nav(){document.querySelector('#nav').innerHTML=tabs.map(([id,n])=>`<button class="${tab===id?'on':''}" data-tab="${id}">${n}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()})}
function stat(n,l,h){return `<div class="card stat"><div class="label">${l}</div><div class="num">${n}</div><div class="hint">${h}</div></div>`}
function render(){nav();document.querySelector('#pageTitle').textContent=tabs.find(x=>x[0]===tab)[1]; document.querySelector('#pageSub').textContent={dashboard:'Centralized identity, RADIUS/TACACS+ policy, and access visibility.',devices:'Register network access devices and shared secrets.',identities:'Manage user credentials, endpoint identities, and authorization groups.',policies:'Evaluate authentication requests against ordered permit rules.',logs:'Authentication results, policy matches, and service events.',settings:'Configure the address and service bindings used by the lab.',diagnostics:'Verify reachability and protocol readiness inside the virtual lab.',cli:'Use an IOS-like operational console for the ISE device.'}[tab]; const a=document.querySelector('#app');a.innerHTML=views[tab]();bind();}
const views={dashboard:()=>{let ok=state.logs.filter(x=>x.status==='success').length,fail=state.logs.filter(x=>x.status==='failure').length;return `<div class="notice"><b>${esc(state.config.hostname)}</b> is online at <span class="mono">${esc(state.config.ip)}</span>. This is a simulator-native ISE device: requests are evaluated by the same persistent lab policy store used by this page.</div><div class="grid stats">${stat(state.devices.filter(x=>x.enabled).length,'Network devices','registered NADs')}${stat(state.users.filter(x=>x.enabled).length,'Identities','enabled users')}${stat(state.endpoints.filter(x=>x.enabled).length,'Endpoints','MAB identities')}${stat(state.sessions.length,'Active sessions','authorized now')}${stat(ok+fail,'Auth attempts',`${ok} permitted · ${fail} denied`)}</div><div class="grid cols"><section class="card"><div class="section-title"><h2>Access tracker</h2><span>latest requests</span></div>${state.logs.slice(0,7).map(log).join('')||'<div class="empty">No authentication events yet.</div>'}</section><section class="card"><div class="section-title"><h2>Service health</h2><span>${pill(state.config.services?'RUNNING':'STOPPED',state.config.services?'good':'bad')}</span></div><div class="check"><i></i><div><b>RADIUS authentication</b><br><span class="muted">UDP ${state.config.radiusPort} · accounting ${state.config.acctPort}</span></div></div><div class="check"><i></i><div><b>TACACS+ device administration</b><br><span class="muted">TCP ${state.config.tacacsPort} · command authorization</span></div></div><div class="check"><i></i><div><b>Policy engine</b><br><span class="muted">${state.policies.length} ordered rules · persistent state</span></div></div><button class="btn primary" style="margin-top:14px" id="quickAuth">Run a RADIUS test</button></section></div>`},devices:()=>`<section class="card"><div class="toolbar"><div class="section-title" style="margin:0"><h2>Network access devices</h2><span>${state.devices.length} registered</span></div><button class="btn primary" data-add="device">Register device</button></div><div class="tablewrap"><table><thead><tr><th>Name</th><th>Type</th><th>IP address</th><th>Protocol</th><th>Status</th><th></th></tr></thead><tbody>${state.devices.map(d=>`<tr><td><b>${esc(d.name)}</b></td><td>${esc(d.type)}</td><td class="mono">${esc(d.ip)}</td><td>${pill(d.protocol,'sky')}</td><td>${pill(d.enabled?'Enabled':'Disabled',d.enabled?'good':'bad')}</td><td class="actions-cell"><button class="btn small" data-edit="device" data-id="${d.id}">Edit</button><button class="btn small danger" data-del="device" data-id="${d.id}">Remove</button></td></tr>`).join('')}</tbody></table></div></section>`,identities:()=>`<div class="grid cols"><section class="card"><div class="toolbar"><div class="section-title" style="margin:0"><h2>Users and groups</h2><span>${state.users.length} identities</span></div><button class="btn primary" data-add="user">Add user</button></div><div class="tablewrap"><table><thead><tr><th>Username</th><th>Group</th><th>Role</th><th>VLAN</th><th></th></tr></thead><tbody>${state.users.map(u=>`<tr><td><b>${esc(u.username)}</b></td><td>${esc(u.group)}</td><td>${esc(u.role)}</td><td class="mono">${esc(u.vlan)}</td><td><button class="btn small danger" data-del="user" data-id="${u.id}">Remove</button></td></tr>`).join('')}</tbody></table></div></section><section class="card"><div class="toolbar"><div class="section-title" style="margin:0"><h2>Endpoint identities</h2><span>MAB database</span></div><button class="btn primary" data-add="endpoint">Add endpoint</button></div><div class="tablewrap"><table><thead><tr><th>Name</th><th>MAC</th><th>Group</th><th>VLAN</th><th></th></tr></thead><tbody>${state.endpoints.map(e=>`<tr><td><b>${esc(e.name)}</b></td><td class="mono">${esc(e.mac)}</td><td>${esc(e.group)}</td><td>${esc(e.vlan)}</td><td><button class="btn small danger" data-del="endpoint" data-id="${e.id}">Remove</button></td></tr>`).join('')}</tbody></table></div></section></div>`,policies:()=>`<section class="card"><div class="toolbar"><div class="section-title" style="margin:0"><h2>Authentication and authorization policies</h2><span>lower priority number evaluates first</span></div><button class="btn primary" data-add="policy">Create policy</button></div><div class="tablewrap"><table><thead><tr><th>Priority</th><th>Name</th><th>Type</th><th>Condition</th><th>Result</th><th>Profile</th><th></th></tr></thead><tbody>${[...state.policies].sort((a,b)=>a.priority-b.priority).map(p=>`<tr><td class="mono">${p.priority}</td><td><b>${esc(p.name)}</b></td><td>${esc(p.kind)}</td><td class="mono">${esc(p.condition)}</td><td>${pill(p.action,p.action==='Permit'?'good':'bad')}</td><td>${esc(p.profile)}</td><td><button class="btn small danger" data-del="policy" data-id="${p.id}">Remove</button></td></tr>`).join('')}</tbody></table></div></section><section class="card" style="margin-top:15px"><div class="section-title"><h2>Policy model</h2></div><div class="kv"><b>Authentication</b><span>Credential or MAC is checked, then the first matching rule returns Permit or Reject.</span><b>Authorization</b><span>Permit profiles return VLAN and ACL attributes to the simulated authenticator.</span><b>Accounting</b><span>Successful sessions remain visible in the dashboard and access tracker.</span></div></section>`,logs:()=>`<section class="card"><div class="toolbar"><div class="section-title" style="margin:0"><h2>Live logs</h2><span>${state.logs.length} events</span></div><button class="btn danger" id="clearLogs">Clear logs</button></div>${state.logs.map(log).join('')||'<div class="empty">No logs.</div>'}</section>`,settings:()=>`<div class="grid cols"><section class="card"><div class="section-title"><h2>ISE node network</h2><span class="mono">${esc(state.config.hostname)}</span></div><form id="settingsForm" class="formgrid"><div class="field"><label>Hostname</label><input name="hostname" value="${esc(state.config.hostname)}"></div><div class="field"><label>Server IP address</label><input name="ip" value="${esc(state.config.ip)}"></div><div class="field"><label>Subnet mask</label><input name="mask" value="${esc(state.config.mask)}"></div><div class="field"><label>Default gateway</label><input name="gateway" value="${esc(state.config.gateway)}"></div><div class="field"><label>DNS server</label><input name="dns" value="${esc(state.config.dns)}"></div><div class="field"><label>RADIUS shared secret</label><input name="secret" type="password" value="${esc(state.config.secret)}"></div><div class="field"><label>RADIUS authentication port</label><input name="radiusPort" type="number" value="${state.config.radiusPort}"></div><div class="field"><label>RADIUS accounting port</label><input name="acctPort" type="number" value="${state.config.acctPort}"></div><div class="field"><label>TACACS+ port</label><input name="tacacsPort" type="number" value="${state.config.tacacsPort}"></div><div class="field"><label>Services</label><select name="services"><option value="true" ${state.config.services?'selected':''}>Running</option><option value="false" ${!state.config.services?'selected':''}>Stopped</option></select></div><div class="field full"><button class="btn primary">Apply network and service configuration</button></div></form></section><section class="card"><div class="section-title"><h2>Bindings</h2><span>${state.config.services?'active':'inactive'}</span></div><div class="kv"><b>RADIUS</b><span>${state.config.radius?'enabled':'disabled'} · UDP ${state.config.radiusPort}</span><b>Accounting</b><span>UDP ${state.config.acctPort}</span><b>TACACS+</b><span>${state.config.tacacs?'enabled':'disabled'} · TCP ${state.config.tacacsPort}</span><b>Reachable address</b><span class="mono">${esc(state.config.ip)}</span></div><div class="notice" style="margin-top:18px">Connect simulated switches and routers to this node using the address above and the matching shared secret. Physical network access is intentionally not exposed by the static Vercel deployment.</div></section></div>`,diagnostics:()=>`<div class="grid three"><section class="card"><div class="section-title"><h2>Network interface</h2></div><div class="check"><i></i><div><b>IP configuration valid</b><br><span class="muted">${esc(state.config.ip)}/${esc(state.config.mask)}</span></div></div><div class="check"><i></i><div><b>Default route configured</b><br><span class="muted">gateway ${esc(state.config.gateway)}</span></div></div><div class="check"><i></i><div><b>DNS configured</b><br><span class="muted">resolver ${esc(state.config.dns)}</span></div></div></section><section class="card"><div class="section-title"><h2>Protocol listeners</h2></div><div class="check"><i class="${state.config.radius?'':'bad'}"></i><div><b>RADIUS ${state.config.radius?'ready':'disabled'}</b><br><span class="muted">UDP ${state.config.radiusPort}</span></div></div><div class="check"><i class="${state.config.tacacs?'':'bad'}"></i><div><b>TACACS+ ${state.config.tacacs?'ready':'disabled'}</b><br><span class="muted">TCP ${state.config.tacacsPort}</span></div></div><button class="btn primary" id="diagTest" style="margin-top:12px">Run connectivity test</button></section><section class="card"><div class="section-title"><h2>Simulator scope</h2></div><p class="muted">This device evaluates AAA requests inside MyPnetLab. It persists state in the browser lab and exposes the same concepts as ISE: NADs, identities, policy sets, profiles, sessions, accounting, and live logs.</p><span class="pill warn">simulated protocols</span></section></div><section class="card" style="margin-top:15px" id="diagResult"><div class="empty">Run the connectivity test to generate evidence.</div></section>`,cli:()=>`<section class="card"><div class="section-title"><h2>ISE-LAB command line</h2><span>privileged exec</span></div><div class="terminal"><pre id="termOut">MyPnetLab ISE virtual device\nType "?" for help.\nISE-LAB# </pre><div class="termrow"><input id="termIn" autocomplete="off" placeholder="show version"><button class="btn primary" id="termSend">Run</button></div></div></section>`};
function log(x){let c=x.status==='success'?'good':x.status==='failure'?'bad':'warn';return `<div class="logline"><span class="muted">${new Date(x.time).toLocaleString()}</span>${pill(x.status.toUpperCase(),c)}<span><b>${esc(x.type)}</b> · ${esc(x.message)} <span class="muted">${esc(x.detail||'')}</span></span></div>`}
function bind(){document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>modal(b.dataset.add));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>remove(b.dataset.del,b.dataset.id));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>modal(b.dataset.edit,state.devices.find(x=>x.id===b.dataset.id)));document.querySelector('#saveBtn').onclick=save;document.querySelector('#authBtn').onclick=()=>modal('auth');document.querySelector('#quickAuth')?.addEventListener('click',()=>modal('auth'));document.querySelector('#clearLogs')?.addEventListener('click',()=>{state.logs=[];save();render()});document.querySelector('#settingsForm')?.addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target);Object.assign(state.config,Object.fromEntries(f));state.config.radiusPort=+state.config.radiusPort;state.config.acctPort=+state.config.acctPort;state.config.tacacsPort=+state.config.tacacsPort;state.config.services=state.config.services==='true';save();render()});document.querySelector('#diagTest')?.addEventListener('click',()=>{const ok=state.config.services;state.logs.unshift({time:now(),type:'DIAGNOSTIC',message:ok?'Connectivity test passed':'Services are stopped',detail:`${state.config.ip} · RADIUS ${state.config.radiusPort} · TACACS+ ${state.config.tacacsPort}`,status:ok?'success':'failure'});save();document.querySelector('#diagResult').innerHTML=`<div class="check"><i class="${ok?'':'bad'}"></i><div><b>${ok?'All simulated service checks passed':'Service check failed'}</b><br><span class="muted">Reachability, port bindings, and policy engine ${ok?'responded':'did not respond'}.</span></div></div>`;});document.querySelector('#termSend')?.addEventListener('click',runCli);document.querySelector('#termIn')?.addEventListener('keydown',e=>{if(e.key==='Enter')runCli()})}
function remove(kind,id){const map={device:'devices',user:'users',endpoint:'endpoints',policy:'policies'};if(confirm('Remove this '+kind+'?')){state[map[kind]]=state[map[kind]].filter(x=>x.id!==id);save();render()}}
function modal(kind,obj){let title=kind==='auth'?'Test AAA request':kind==='device'?(obj?'Edit network device':'Register network device'):kind==='user'?'Add user':kind==='endpoint'?'Add endpoint':'Create policy';let body=kind==='auth'?`<form id="modalForm" class="formgrid"><div class="field"><label>Protocol</label><select name="protocol"><option>RADIUS</option><option>TACACS+</option><option>MAB</option></select></div><div class="field"><label>Network device</label><select name="device">${state.devices.map(d=>`<option value="${d.id}">${esc(d.name)} · ${esc(d.ip)}</option>`).join('')}</select></div><div class="field"><label>Username or MAC</label><input name="identity" value="alice" required></div><div class="field"><label>Password (not used for MAB)</label><input name="password" type="password" value="C1sco!23"></div><div class="field full"><button class="btn primary">Send request</button></div></form>`:kind==='device'?`<form id="modalForm" class="formgrid"><div class="field"><label>Name</label><input name="name" value="${esc(obj?.name||'ACC-SW2')}" required></div><div class="field"><label>Type</label><select name="type"><option>Cisco switch</option><option>Cisco router</option><option>Cisco firewall</option><option>Wireless controller</option></select></div><div class="field"><label>IP address</label><input name="ip" value="${esc(obj?.ip||'10.99.99.13')}" required></div><div class="field"><label>Protocol</label><select name="protocol"><option>RADIUS</option><option>TACACS+</option></select></div><div class="field"><label>Shared secret</label><input name="secret" type="password" value="${esc(obj?.secret||state.config.secret)}" required></div><div class="field full"><button class="btn primary">${obj?'Update':'Register'} device</button></div></form>`:kind==='user'?`<form id="modalForm" class="formgrid"><div class="field"><label>Username</label><input name="username" value="alice2" required></div><div class="field"><label>Password</label><input name="password" value="C1sco!23" required></div><div class="field"><label>Group</label><input name="group" value="Employees"></div><div class="field"><label>Role</label><input name="role" value="Network User"></div><div class="field"><label>VLAN</label><input name="vlan" value="20"></div><div class="field"><label>ACL / authorization profile</label><input name="acl" value="EMPLOYEE-ACCESS"></div><div class="field full"><button class="btn primary">Create identity</button></div></form>`:kind==='endpoint'?`<form id="modalForm" class="formgrid"><div class="field"><label>Endpoint name</label><input name="name" value="IOT-NEW" required></div><div class="field"><label>MAC address</label><input name="mac" value="AA:BB:CC:DD:EE:02" required></div><div class="field"><label>Group</label><input name="group" value="IoT"></div><div class="field"><label>VLAN</label><input name="vlan" value="40"></div><div class="field full"><button class="btn primary">Create endpoint</button></div></form>`:`<form id="modalForm" class="formgrid"><div class="field"><label>Policy name</label><input name="name" value="New policy" required></div><div class="field"><label>Priority</label><input name="priority" type="number" value="40"></div><div class="field"><label>Condition</label><input name="condition" value="group=Employees"></div><div class="field"><label>Result</label><select name="action"><option>Permit</option><option>Reject</option></select></div><div class="field"><label>Authorization profile</label><input name="profile" value="EMPLOYEE-ACCESS"></div><div class="field full"><button class="btn primary">Create policy</button></div></form>`;document.querySelector('#modal').innerHTML=`<div class="modal"><div class="card"><div class="section-title"><h2>${title}</h2><button class="btn small" id="closeModal">Close</button></div>${body}</div></div>`;document.querySelector('#modal').classList.remove('hidden');document.querySelector('#closeModal').onclick=closeModal;document.querySelector('#modalForm').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(kind==='auth')authenticate(f);else if(kind==='device'){let d={id:obj?.id||'nad-'+Date.now(),...f,enabled:true};obj?Object.assign(obj,d):state.devices.push(d);save();closeModal();render()}else if(kind==='user'){state.users.push({id:'u-'+Date.now(),...f,enabled:true});save();closeModal();render()}else if(kind==='endpoint'){state.endpoints.push({id:'ep-'+Date.now(),...f,enabled:true});save();closeModal();render()}else{state.policies.push({id:'p-'+Date.now(),kind:'Authentication',...f,priority:+f.priority});save();closeModal();render()}}}
function closeModal(){document.querySelector('#modal').classList.add('hidden');document.querySelector('#modal').innerHTML=''}
function authenticate(f){let d=state.devices.find(x=>x.id===f.device),match,user,detail;const proto=f.protocol;if(!state.config.services){result('failure','Services stopped','Enable ISE services before sending requests.');return}if(!d){result('failure','Unknown network device','The requesting device is not registered.');return}if(d.secret!==state.config.secret){result('failure','Shared secret mismatch',`${d.name} does not match the ISE node secret.`);return}if(proto==='MAB'){let mac=f.identity.toUpperCase(),ep=state.endpoints.find(x=>x.mac.toUpperCase()===mac&&x.enabled);if(ep){match=state.policies.find(p=>p.condition===`group=${ep.group}`);detail=`MAB permit · VLAN ${ep.vlan} · ${match?.name||'default'}`}else detail='MAC address not found in endpoint identity store'}else{user=state.users.find(x=>x.username===f.identity&&x.password===f.password&&x.enabled);if(user){match=state.policies.find(p=>p.condition===`group=${user.group}`);detail=`${proto} permit · VLAN ${user.vlan} · ACL ${user.acl}`}else detail='Invalid credentials or disabled identity'}const ok=!!(match&&match.action==='Permit');if(ok)state.sessions.unshift({id:'s-'+Date.now(),identity:f.identity,device:d.name,protocol:proto,vlan:user?.vlan||state.endpoints.find(x=>x.mac.toUpperCase()===f.identity.toUpperCase())?.vlan||'—',time:now()});state.logs.unshift({time:now(),type:proto,message:ok?'Authentication permitted':'Authentication rejected',detail:`${f.identity} via ${d.name} · ${ok?detail:'no matching permit policy'}`,status:ok?'success':'failure'});save();closeModal();toast(ok?'Access permitted — session created':'Access rejected');tab='dashboard';render()}
function result(status,message,detail){state.logs.unshift({time:now(),type:'AAA',message,detail,status});save();closeModal();toast(message);render()}
function runCli(){let input=document.querySelector('#termIn').value.trim(),out=document.querySelector('#termOut');let lines=out.textContent.split('\n');let cmd=input.toLowerCase(),r;if(cmd==='?'||cmd==='help')r='show version\nshow running-config\nshow network-devices\nshow radius statistics\nshow sessions\nshow logging\ntest aaa group radius <user> <password>\nclear logging';else if(cmd==='show version')r='MyPnetLab ISE Virtual Device\nVersion 3.2.0-sim\nPersonas: Policy Service, Administration\nStatus: '+(state.config.services?'RUNNING':'STOPPED');else if(cmd==='show running-config')r=`hostname ${state.config.hostname}\nip address ${state.config.ip} ${state.config.mask}\ndefault-gateway ${state.config.gateway}\nradius-server host ${state.config.ip} auth-port ${state.config.radiusPort} acct-port ${state.config.acctPort}\ntacacs-server port ${state.config.tacacsPort}\nservice ${state.config.services?'enabled':'disabled'}`;else if(cmd==='show network-devices')r=state.devices.map(d=>`${d.name.padEnd(14)} ${d.ip.padEnd(16)} ${d.protocol.padEnd(8)} ${d.enabled?'enabled':'disabled'}`).join('\n')||'No devices';else if(cmd==='show radius statistics')r=`Access requests: ${state.logs.filter(x=>x.type==='RADIUS').length}\nAccepts: ${state.logs.filter(x=>x.type==='RADIUS'&&x.status==='success').length}\nRejects: ${state.logs.filter(x=>x.type==='RADIUS'&&x.status==='failure').length}\nAccounting port: ${state.config.acctPort}`;else if(cmd==='show sessions')r=state.sessions.map(s=>`${s.identity.padEnd(12)} ${s.device.padEnd(12)} VLAN ${s.vlan} ${s.protocol}`).join('\n')||'No active sessions';else if(cmd==='show logging')r=state.logs.slice(0,12).map(x=>`${new Date(x.time).toLocaleTimeString()} ${x.status.toUpperCase()} ${x.type} ${x.message}`).join('\n')||'No logs';else if(cmd.startsWith('test aaa group radius ')){let a=input.split(/\s+/),u=state.users.find(x=>x.username===a[4]&&x.password===a[5]);r=u?'Authentication succeeded · policy permit · VLAN '+u.vlan:'Authentication failed · invalid credentials';state.logs.unshift({time:now(),type:'RADIUS',message:r,detail:'CLI test request',status:u?'success':'failure'});save()}else if(cmd==='clear logging'){state.logs=[];save();r='Logging buffer cleared';}else r='% Invalid command. Type ? for help.';out.textContent=lines.slice(-1)[0]+' '+input+'\n'+r+'\nISE-LAB# ';document.querySelector('#termIn').value='';out.scrollTop=out.scrollHeight}
render();
})();
</script>
</body></html>
