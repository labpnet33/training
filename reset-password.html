<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Reset password</title><link rel="stylesheet" href="/auth.css"></head><body data-page="reset-password"><main class="auth-shell"><a class="brand" href="/">MyPnetLab</a><section class="auth-card"><p class="eyebrow">ACCOUNT RECOVERY</p><h1>Choose a new password</h1><p class="muted">Use at least 8 characters.</p><div class="notice" id="notice" role="status" aria-live="polite" hidden></div><form id="auth-form"><label for="password">New password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required><label for="confirm-password">Confirm new password</label><input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="8" required><button class="primary" type="submit">Update password</button></form><p class="center"><a href="/login">Back to sign in</a></p></section></main><script type="module" src="/auth.js"></script></body></html>
